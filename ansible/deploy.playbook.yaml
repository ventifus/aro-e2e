---
- name: Deploy simple clusters
  hosts: standard_clusters
  gather_facts: false
  serial: "{{ max_simultaneous_clusters | default(1) }}"
  environment:
    AZURE_CORE_SURVEY_MESSAGE: "false"
    REQUESTS_CA_BUNDLE: /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt
    RP_MODE: "{{ rp_mode | default(omit) }}"
  roles:
    - azureredhatopenshift.classic.standard_cluster
    - azureredhatopenshift.classic.smoketest
    - azureredhatopenshift.classic.cleanup
- name: Bring your own keys disk encryption
  hosts: byok_clusters
  gather_facts: false
  serial: "{{ max_simultaneous_clusters | default(1) }}"
  environment:
    AZURE_CORE_SURVEY_MESSAGE: "false"
    REQUESTS_CA_BUNDLE: /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt
    RP_MODE: "{{ rp_mode | default(omit) }}"
  roles:
    - azureredhatopenshift.classic.byok_cluster
    - azureredhatopenshift.classic.smoketest
    - azureredhatopenshift.classic.cleanup
- name: MIWI clusters
  hosts: miwi_clusters
  gather_facts: false
  serial: "{{ max_simultaneous_clusters | default(1) }}"
  environment:
    AZURE_CORE_SURVEY_MESSAGE: "false"
    REQUESTS_CA_BUNDLE: /etc/pki/ca-trust/extracted/openssl/ca-bundle.trust.crt
    RP_MODE: "{{ rp_mode | default(omit) }}"
  roles:
    - azureredhatopenshift.classic.miwi_cluster
    - azureredhatopenshift.classic.smoketest
    - azureredhatopenshift.classic.cleanup
- name: Post-creation tasks
  hosts: all
  gather_facts: false
  roles:
    - azureredhatopenshift.classic.post_creation
